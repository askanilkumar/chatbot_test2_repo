steps:
  - name: 'python:3.12-slim'
    entrypoint: bash
    args: ['-c', 'pip install -r requirements.txt && python guardrail_selftest.py']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cicd-chatbot-demo', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cicd-chatbot-demo']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: ['run', 'deploy', 'cicd-chatbot-demo', '--image=gcr.io/$PROJECT_ID/cicd-chatbot-demo', '--region=us-central1', '--port=8080', '--allow-unauthenticated']

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/cicd-chatbot-demo'
